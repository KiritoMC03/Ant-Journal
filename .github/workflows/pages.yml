name: Journal website

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: journal-pages-${{ github.ref }}
  cancel-in-progress: true

env:
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.25.0
          run_install: false
      - name: Install core dependencies
        working-directory: ant-journal-plugin
        run: pnpm install --frozen-lockfile
      - name: Install website dependencies
        working-directory: website
        run: npm ci --ignore-scripts
      - name: Ensure video poster support
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: website/.cache/media-v1
          key: journal-media-v1-${{ runner.os }}-${{ github.sha }}
          restore-keys: journal-media-v1-${{ runner.os }}-
      - name: Audit the current publication snapshot
        working-directory: ant-journal-plugin
        run: node scripts/public-check.mjs --working-only
      - name: Check and test the journal core
        working-directory: ant-journal-plugin
        run: |
          node node_modules/typescript/bin/tsc --noEmit
          node --import tsx --test test/*.test.ts
          node --import tsx scripts/validate.ts ../AntJournal
      - name: Test the website adapter
        working-directory: website
        run: npm test
      - name: Configure Pages
        id: pages
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Build the website and check all local links
        working-directory: website
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          SITE_BASE: ${{ steps.pages.outputs.base_path }}
          REPOSITORY_URL: https://github.com/${{ github.repository }}
        run: |
          npm run build
          npm run check
          cat dist/build-report.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: website/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the verified artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
